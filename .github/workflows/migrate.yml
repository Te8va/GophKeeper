name: Database Migrations

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'migrations/**'
      - 'cmd/migrate/**'
      - 'internal/app/repository/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ main ]
    paths:
      - 'migrations/**'
      - 'cmd/migrate/**'

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gophkeeper
          POSTGRES_PASSWORD: gophkeeper
          POSTGRES_DB: gophkeeper
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: go.sum
          
      - name: Download dependencies
        run: go mod download
          
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U gophkeeper; then
              echo "✅ PostgreSQL is ready!"
              break
            else
              echo "⏳ Waiting for PostgreSQL... (attempt $i/10)"
              sleep 3
            fi
          done
          
      - name: Verify migrations can be built
        run: |
          go build -o /dev/null cmd/migrate/main.go
          echo "✅ Migration tool builds successfully"
          
      - name: Run migrations up
        run: |
          go run cmd/migrate/main.go \
            -dsn "postgres://gophkeeper:gophkeeper@localhost:5432/gophkeeper?sslmode=disable" \
            -command up
            
      - name: Verify migrations version
        run: |
          go run cmd/migrate/main.go \
            -dsn "postgres://gophkeeper:gophkeeper@localhost:5432/gophkeeper?sslmode=disable" \
            -command version
            
      - name: Run migrations down (test rollback)
        if: always() && github.event_name == 'pull_request'
        run: |
          go run cmd/migrate/main.go \
            -dsn "postgres://gophkeeper:gophkeeper@localhost:5432/gophkeeper?sslmode=disable" \
            -command down || echo "Rollback completed or not needed"